<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Médongaule Archive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: the alpha-grid template (leo-study grid: 12 columns, 8 at ≤1025px, 1.38889vw gap, rem tied to the viewport)
     with every Médongaule photograph and nothing written on the page. Rows of fixed patterns for the garden, two
     pinned rails sliding against each other for the people, a pinned stack for the build-up, one frame per photo. */
  :root {
    color-scheme: light;
    --paper: #f6f6f3;
    --ink: #0f1a15;
    --olive: #373d1a;      /* Mugwort Olive */
    --orange: #cc2f0a;     /* Maple Orange, as on the boards */
    --beige: #bebe8f;      /* Mugwort Beige */
    --stage: var(--paper);
    --fg: var(--ink);
    --cols: 12;
    --gap: 1.38889vw;
    --margin: max(16px, 1.42857rem);
    --ease: cubic-bezier(0.16, 1, 0.1, 1);
  }
  /* a dark system with no choice made yet starts on ink; a choice always wins */
  @media (prefers-color-scheme: dark) { :root:not([data-stage]) { --stage: #000000; --fg: var(--paper); color-scheme: dark; } }
  :root[data-stage="ink"] { --stage: #000000; --fg: var(--paper); color-scheme: dark; }
  :root[data-stage="olive"] { --stage: var(--olive); --fg: var(--beige); color-scheme: dark; }
  :root[data-stage="orange"] { --stage: var(--orange); --fg: var(--beige); color-scheme: dark; }
  :root[data-stage="beige"] { --stage: var(--beige); --fg: var(--olive); }
  @media (max-width: 1025px) { :root { --cols: 8; } }
  @media (max-width: 576px) { :root { --gap: 8px; } }

  html { font-size: max(13px, 0.97222vw); background: var(--stage); transition: background-color 0.9s var(--ease); }
  @media (min-width: 1920px) { html { font-size: 1vw; } }
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  html.lock { overflow: hidden; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stage); color: var(--fg); overflow-x: clip; transition: background-color 0.9s var(--ease); -webkit-font-smoothing: antialiased; }
  figure { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  img { display: block; max-width: 100%; }
  * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

  .g {
    display: grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    column-gap: var(--gap);
    padding-left: max(var(--margin), env(safe-area-inset-left, 0px));
    padding-right: max(var(--margin), env(safe-area-inset-right, 0px));
  }

  /* loader: a hairline fills, then the stage lifts off */
  .loader { position: fixed; inset: 0; z-index: 90; background: var(--stage); clip-path: inset(0 0 0 0); transition: clip-path 1.1s var(--ease); }
  .loader.done { clip-path: inset(0 0 100% 0); }
  .loader i { position: absolute; left: var(--margin); right: var(--margin); top: 50%; height: 1px; background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .loader i::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); background: var(--fg); transition: width 0.4s var(--ease); }

  /* nav: only the stage dots */
  .nav { position: fixed; inset: 0 0 auto; z-index: 50; padding-top: calc(2rem + env(safe-area-inset-top, 0px)); color: #fff; mix-blend-mode: difference; pointer-events: none; }
  .stage-pick { grid-column: -4 / -1; justify-self: end; display: flex; gap: 0.9rem; pointer-events: auto; }
  .stage-pick button { width: 1.6rem; height: 1.6rem; display: grid; place-items: center; }
  .stage-pick i { width: 0.7rem; height: 0.7rem; border-radius: 50%; border: 1px solid currentColor; transition: background-color 0.4s var(--ease), transform 0.4s var(--ease); }
  .stage-pick button[aria-pressed="true"] i { background: currentColor; }
  .stage-pick button:hover i { transform: scale(1.3); }

  /* head: one photograph, full bleed */
  .head { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
  .head img { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%; will-change: transform; }

  /* garden grid: rows of fixed patterns, heights counted in grid columns so every row lands on the grid */
  .grid-sec { container-type: inline-size; padding-top: calc(5.6rem + env(safe-area-inset-top, 0px)); }
  .row { --colw: calc((100cqw - 2 * var(--margin) - 11 * var(--gap)) / 12); height: calc(var(--h) * var(--colw)); }
  .row + .row { margin-top: var(--gap); }
  .row.blk + .row { margin-top: 8rem; }
  .t { position: relative; overflow: hidden; height: 100%; min-width: 0; cursor: zoom-in; background: color-mix(in srgb, var(--fg) 6%, var(--stage)); }
  .t img { width: 100%; height: 100%; object-fit: cover; }
  .js .row .t { clip-path: inset(100% 0 0 0); transition: clip-path 1.3s var(--ease), background-color 0.9s var(--ease); }
  .js .row .t img { transform: scale(1.14); transition: transform 1.6s var(--ease); }
  .js .row .t.in { clip-path: inset(0 0 0 0); }
  .js .row .t.in img { transform: scale(1); }
  .js .row .t.in:hover img { transform: scale(1.035); transition-duration: 1s; }
  @media (max-width: 1025px) {
    .row { --colw: calc((100cqw - 2 * var(--margin) - 11 * var(--gap)) / 12); grid-template-columns: repeat(12, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    /* phones: the rows dissolve into one two-column flow, packed so no portrait leaves a hole */
    .grid-sec { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); grid-auto-flow: dense; padding-inline: var(--margin); }
    .row { display: contents; }
    .row .t { grid-column: auto !important; aspect-ratio: 4 / 5; }
    .row .t[data-o="L"] { grid-column: 1 / -1 !important; aspect-ratio: 3 / 2; }
  }

  /* people: two pinned rails sliding against each other */
  .rails { margin-top: 10rem; }
  .rl-pin { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; display: grid; align-content: center; row-gap: var(--gap); }
  .rail { display: flex; gap: var(--gap); width: max-content; padding-inline: var(--margin); will-change: transform; }
  .rt { flex: none; height: max(min(36svh, 30vw), 24svh); cursor: zoom-in; }
  .rt img { height: 100%; width: auto; transition: transform 1s var(--ease); }
  .rt:hover img { transform: scale(1.035); }

  /* build-up: a pinned stack, each frame laid over the last */
  .stack { margin-top: 6rem; }
  .sk-pin { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
  .st { position: absolute; left: 50%; top: 50%; cursor: zoom-in; background: none; will-change: transform; box-shadow: 0 2.4rem 5rem -2rem rgba(0, 0, 0, 0.35); }
  .st img { max-height: 74svh; max-width: 84vw; width: auto; height: auto; }

  /* end: one photograph, full bleed, and the way back up */
  .end { position: relative; height: 100vh; height: 100svh; overflow: hidden; margin-top: 10rem; }
  .end img { width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .foot { padding-block: 2.4rem calc(2.4rem + env(safe-area-inset-bottom, 0px)); }
  .up { grid-column: -2 / -1; justify-self: end; width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; transition: background-color 0.4s var(--ease), color 0.4s var(--ease); }
  .up:hover { background: var(--fg); color: var(--stage); }
  .up svg { width: 1.1rem; height: 1.1rem; }

  /* one frame per photo */
  .lb { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; }
  .lb[hidden] { display: none; }
  .lb-bg { position: absolute; inset: 0; background: var(--stage); opacity: 0; transition: opacity 0.5s var(--ease); }
  .lb.open .lb-bg { opacity: 0.97; }
  .lb img { position: relative; max-width: calc(100vw - 2 * var(--margin)); max-height: calc(100svh - 7rem); width: auto; height: auto; opacity: 0; transform: translateY(3vh) scale(0.97); transition: opacity 0.5s var(--ease), transform 0.9s var(--ease); pointer-events: none; }
  .lb.open img.on { opacity: 1; transform: none; }
  .lb-p, .lb-n { position: absolute; top: 0; bottom: 0; width: 50%; }
  .lb-p { left: 0; cursor: w-resize; } .lb-n { right: 0; cursor: e-resize; }
  .lb-x { position: absolute; z-index: 2; top: calc(1.6rem + env(safe-area-inset-top, 0px)); right: var(--margin); width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; color: var(--fg); transition: transform 0.5s var(--ease); }
  .lb-x:hover { transform: rotate(90deg); }
  .lb-x svg { width: 0.9rem; height: 0.9rem; }

  @media (prefers-reduced-motion: reduce) {
    .js .row .t { clip-path: none; transition: none; }
    .js .row .t img { transform: none; transition: none; }
    .rl-pin, .sk-pin { position: static; height: auto; }
  }
</style></head>

  <div class="lb-bg"></div>
  <img id="lbi" alt="">
  <button class="lb-p" id="lbp" type="button" aria-label="Previous photo"></button>

  <button class="lb-x" id="lbx" type="button" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg></button>

<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(() => {
  const $ = (s, c = document) => c.querySelector(s), $$ = (s, c = document) => [...c.querySelectorAll(s)];
  const root = document.documentElement;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.classList.add("js");
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  scrollTo(0, 0);

  /* stage colour, remembered per viewer */
  const picks = $$(".stage-pick button");
  function stage(s) {
    root.dataset.stage = s;
    picks.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.stage === s)));
    try { localStorage.setItem("mdg-stage", s); } catch (e) {}
  }
  picks.forEach((b) => b.addEventListener("click", () => stage(b.dataset.stage)));
  let saved = null;
  try { saved = localStorage.getItem("mdg-stage"); } catch (e) {}
  if (saved && picks.some((b) => b.dataset.stage === saved)) stage(saved); else if (matchMedia("(prefers-color-scheme: dark)").matches) picks.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.stage === "ink")));

  /* loader: waits for the first rows, never longer than 3.5 s */
  const loader = $("#loader"), first = $$(".row img").slice(0, 8);
  first.forEach((im) => { im.loading = "eager"; });
  let got = 0, lifted = false;
  root.classList.add("lock");
  function lift() { if (lifted) return; lifted = true; loader.style.setProperty("--p", "100%"); setTimeout(() => { loader.classList.add("done"); root.classList.remove("lock"); }, 350); }
  first.forEach((im) => { const tick = () => { got++; loader.style.setProperty("--p", (got / first.length * 100) + "%"); if (got >= first.length) lift(); };
    if (im.complete) tick(); else { im.addEventListener("load", tick, { once: true }); im.addEventListener("error", tick, { once: true }); } });
  setTimeout(lift, 3500);

  /* tiles open as they come in */
  /* tiles open as they come in; any a fast jump skipped past open too, so nothing above the fold stays shut */
  let shut = $$(".row .t"), fc = 0;
  function reveal() {
    const lim = innerHeight * 0.94;
    shut = shut.filter((t) => { if (t.getBoundingClientRect().top < lim) { t.classList.add("in"); return false; } return true; });
  }

  /* smooth scroll, as in the template */
  let lenis = null;
  if (window.Lenis && !reduce) {
    lenis = new Lenis({ lerp: 0.09 });
    (function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })(performance.now());
  }
  $("#up").addEventListener("click", () => lenis ? lenis.scrollTo(0, { duration: 1.6 }) : scrollTo({ top: 0, behavior: "smooth" }));

  /* one frame per photo: click a photo, then left / right halves, arrow keys or a swipe */
  const all = $$("main figure.t img"), lb = $("#lb"), lbi = $("#lbi");
  let at = -1;
  function show(i) {
    at = (i + all.length) % all.length;
    lbi.classList.remove("on");
    const src = all[at].currentSrc || all[at].src, im = new Image();
    im.onload = im.onerror = () => { lbi.src = src; requestAnimationFrame(() => lbi.classList.add("on")); };
    im.src = src;
  }
  function open(i) { lb.hidden = false; root.classList.add("lock"); lenis && lenis.stop(); requestAnimationFrame(() => lb.classList.add("open")); show(i); }
  function close() { lb.classList.remove("open"); lbi.classList.remove("on"); lenis && lenis.start(); root.classList.remove("lock"); setTimeout(() => { if (!lb.classList.contains("open")) lb.hidden = true; }, 500); }
  all.forEach((im, i) => im.closest("figure").addEventListener("click", () => open(i)));
  $("#lbp").addEventListener("click", () => show(at - 1));
  $("#lbn").addEventListener("click", () => show(at + 1));
  $("#lbx").addEventListener("click", close);
  addEventListener("keydown", (e) => { if (lb.hidden) return; if (e.key === "Escape") close(); if (e.key === "ArrowLeft") show(at - 1); if (e.key === "ArrowRight") show(at + 1); });
  let sx = null;
  lb.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => { if (sx === null) return; const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 40) show(at + (d < 0 ? 1 : -1)); sx = null; });

  /* pinned pieces */
  const endS = $(".end"), endI = $(".end img");
  const rlt = $("#rlt"), ra = $("#ra"), rb = $("#rb");
  const skt = $("#skt"), cards = $$("#skp .st");
  let overA = 0, overB = 0;
  function layout() {
    overA = Math.max(0, ra.scrollWidth - innerWidth); overB = Math.max(0, rb.scrollWidth - innerWidth);
    rlt.style.height = reduce ? "" : (innerHeight + Math.max(overA, overB) * 0.75) + "px";
  }
  function prog(el) { const r = el.getBoundingClientRect(), L = el.offsetHeight - innerHeight; return L > 0 ? clamp(-r.top / L) : 0; }
  function frame() {
    const vh = innerHeight;
    if (shut.length && (++fc % 4 === 0)) reveal();
    if (!reduce) {
      const p = prog(rlt);
      ra.style.transform = `translate3d(${-p * overA}px, 0, 0)`;
      rb.style.transform = `translate3d(${-(1 - p) * overB}px, 0, 0)`;
      const s = prog(skt) * (cards.length - 1);
      cards.forEach((c, i) => {
        const inn = i === 0 ? 1 : ease(clamp(s - (i - 1))), past = clamp(s - i);
        c.style.transform = `translate(-50%, calc(-50% + ${(1 - inn) * 110}vh)) scale(${1 - past * 0.05}) rotate(${(i % 2 ? 1 : -1) * 1.4 * (1 - inn * 0.6)}deg)`;
        c.style.zIndex = i;
      });
      const er = endS.getBoundingClientRect(), eq = clamp(1 - er.top / vh);
      endI.style.transform = `scale(${1.18 - eq * 0.18})`;
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", layout);
  addEventListener("load", layout);
  $$(".rt img").forEach((im) => im.addEventListener("load", layout));
  layout();
  requestAnimationFrame(frame);
})();
</script>
