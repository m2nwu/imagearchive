<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Médongaule Image Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<style>
  /* Layout after the Médongaule homepage collage: a logo box and one tall photograph held in the left column, the
     menu across the top, and the photographs set as mosaics on a 24-column grid, spread after spread. Each spread
     keeps a little of the reference's empty space (a cell left open beside a small photo). Web-size photographs only. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #111111;
    --mute: #8a8a85;
    --line: #111111;
    --gap: 10px;
    --side: 190px;
    --pad: clamp(16px, 3.2vw, 64px);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f0f0e; --fg: #ecebe6; --mute: #85847e; --line: #ecebe6; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #0f0f0e; --fg: #ecebe6; --mute: #85847e; --line: #ecebe6; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 500 15px/1.4 "Jost", "Futura", "Avenir Next", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  .page { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); column-gap: clamp(28px, 3.3vw, 64px); padding: 38px var(--pad) 0; }

  /* left: the logo box with its visit bar, and one tall photograph that follows the spread in view */
  .side { position: sticky; top: 38px; align-self: start; display: grid; row-gap: 16px; }
  .logo { display: grid; border: 2px solid var(--line); background: var(--bg); }
  .logo .mark { display: grid; place-items: center; aspect-ratio: 190 / 188; padding: 0 16px; }
  .logo .mark svg { width: 100%; height: auto; overflow: visible; fill: var(--fg); fill-rule: evenodd; }
  .logo .visit { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 7px; background: var(--fg); color: var(--bg); font-weight: 400; font-size: 16px; letter-spacing: -0.01em; }
  .logo .visit svg { width: 15px; height: 15px; transition: transform 0.4s var(--ease); }
  .logo .visit:hover svg { transform: translate(2px, -2px); }
  .feature { position: relative; aspect-ratio: 186 / 525; overflow: hidden; background: color-mix(in srgb, var(--fg) 6%, var(--bg)); cursor: zoom-in; }
  .feature img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.9s var(--ease); }
  .feature img.on { opacity: 1; }

  /* top: the menu, which filters the archive, and the index */
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 0 22px; margin-top: -4px; background: var(--bg); }
  .menu { display: flex; gap: clamp(22px, 3.3vw, 52px); font-weight: 600; font-size: clamp(15px, 1.1vw, 20px); letter-spacing: 0.01em; text-transform: uppercase; }
  .menu button { position: relative; padding: 4px 0; }
  .menu button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform 0.5s var(--ease); }
  .menu button:hover::after, .menu button[aria-pressed="true"]::after { transform: scaleX(1); }
  .menu sup { font-size: 0.55em; font-weight: 500; margin-left: 3px; color: var(--mute); }
  .tools { display: flex; align-items: center; gap: clamp(18px, 2.2vw, 34px); }
  .match { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: clamp(13px, 0.9vw, 16px); text-transform: uppercase; letter-spacing: 0.02em; padding: 6px 12px 6px 8px; border: 2px solid var(--line); border-radius: 999px; transition: background-color 0.35s var(--ease), color 0.35s var(--ease); }
  .match svg { width: 22px; height: 16px; }
  .match[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .pal-bar { display: flex; height: 12px; margin-bottom: 12px; overflow: hidden; }
  .pal-bar i { display: block; height: 100%; transform-origin: left; transform: scaleX(0); transition: transform 1.1s var(--ease); }
  .spread.in .pal-bar i { transform: scaleX(1); }
  .spread.in .pal-bar i:nth-child(2) { transition-delay: .06s; } .spread.in .pal-bar i:nth-child(3) { transition-delay: .12s; } .spread.in .pal-bar i:nth-child(4) { transition-delay: .18s; } .spread.in .pal-bar i:nth-child(5) { transition-delay: .24s; } .spread.in .pal-bar i:nth-child(6) { transition-delay: .3s; } .spread.in .pal-bar i:nth-child(7) { transition-delay: .36s; }
  .spread .pal-bar { grid-column: 1 / -1; grid-row: 1; align-self: end; }
  .harmony .spread { grid-template-rows: 24px; grid-auto-rows: calc((100cqw - 23 * var(--gap)) / 24 * 1.46); }
  .harmony .t { grid-row: calc(var(--r) + 1) / span var(--rs); }
  .lb { grid-template-rows: auto minmax(0, 1fr) auto auto; }
  .lb-match { display: flex; align-items: center; gap: 18px; padding: 4px 0 14px; min-height: 76px; }
  .lb-match .chips { display: flex; flex: none; }
  .lb-match .chips i { width: 22px; height: 56px; }
  .lb-match .lab { flex: none; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; color: var(--mute); }
  .lb-match .near { display: flex; gap: var(--gap); min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .lb-match .near button { flex: none; height: 56px; overflow: hidden; }
  .lb-match .near img { height: 100%; width: auto; transition: transform .5s var(--ease); }
  .lb-match .near button:hover img { transform: scale(1.06); }
  .burger { width: 30px; height: 22px; display: grid; align-content: space-between; }
  .burger i { display: block; height: 3px; background: currentColor; transition: transform 0.4s var(--ease), opacity 0.3s; }
  .burger[aria-expanded="true"] i:nth-child(1) { transform: translateY(9.5px) rotate(45deg); }
  .burger[aria-expanded="true"] i:nth-child(2) { opacity: 0; }
  .burger[aria-expanded="true"] i:nth-child(3) { transform: translateY(-9.5px) rotate(-45deg); }

  /* the mosaics: 24 columns, rows tied to the column width so every spread keeps its proportions */
  .main { container-type: inline-size; min-width: 0; }
  .spread { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); grid-auto-rows: calc((100cqw - 23 * var(--gap)) / 24 * 1.46); gap: var(--gap); }
  .spread + .spread { margin-top: clamp(48px, 6vw, 96px); }
  .t { position: relative; overflow: hidden; grid-column: var(--c) / span var(--cs); grid-row: var(--r) / span var(--rs); background: color-mix(in srgb, var(--fg) 6%, var(--bg)); cursor: zoom-in; }
  .t img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
  .t:hover img { transform: scale(1.035); }
  .js .t { opacity: 0; transform: translateY(14px); transition: opacity 0.9s var(--ease), transform 1.1s var(--ease); transition-delay: calc(var(--k) * 60ms); }
  .js .spread.in .t { opacity: 1; transform: none; }

  /* the close: one photograph across the whole width, the wordmark rising out of it in white — the garden's own logo film */
  .finale { position: relative; height: 100vh; height: 100svh; margin-top: clamp(64px, 8vw, 120px); overflow: hidden; background: #111; }
  .finale img { width: 100%; height: 100%; object-fit: cover; }
  .finale::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,0,0,.28), rgba(0,0,0,.08) 70%); pointer-events: none; }
  .finale .film { position: absolute; z-index: 1; left: 50%; top: 50%; width: min(78vw, 980px); transform: translate(-50%, -50%); }
  .finale .film svg { display: block; width: 100%; height: auto; overflow: visible; fill: #fff; fill-rule: evenodd; }
  @media (max-width: 860px) { .finale { height: 72svh; } .finale .film { width: 86vw; } }
  .foot { text-align: center; padding: clamp(56px, 7vw, 110px) 0 calc(36px + env(safe-area-inset-bottom, 0px)); font-size: 14px; }
  .foot p { margin: 0; }
  .foot .mute { color: var(--mute); margin-top: 6px; font-weight: 400; }

  /* the index: every photograph at once */
  .index { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto; padding: 38px var(--pad) 48px; opacity: 0; visibility: hidden; transition: opacity 0.4s var(--ease), visibility 0s 0.4s; }
  .index.open { opacity: 1; visibility: visible; transition: opacity 0.4s var(--ease); }
  .index-head { position: sticky; top: -38px; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 0 22px; background: var(--bg); font-weight: 600; font-size: clamp(15px, 1.1vw, 20px); text-transform: uppercase; }
  .index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: var(--gap); }
  .index-grid button { aspect-ratio: 1; overflow: hidden; background: color-mix(in srgb, var(--fg) 6%, var(--bg)); }
  .index-grid img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease), opacity 0.3s; }
  .index-grid button:hover img { transform: scale(1.06); }

  /* one photograph at a time */
  .lb { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); padding: 26px var(--pad) 22px; opacity: 0; visibility: hidden; transition: opacity 0.35s var(--ease), visibility 0s 0.35s; }
  .lb.open { opacity: 1; visibility: visible; transition: opacity 0.35s var(--ease); }
  .lb-top, .lb-bot { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .lb-top b { font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
  .lb-stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 18px 0; }
  .lb-stage img { position: absolute; inset: 18px 0; margin: auto; width: auto; height: auto; max-width: 100%; max-height: calc(100% - 36px); object-fit: contain; opacity: 0; transform: scale(0.985); transition: opacity 0.4s var(--ease), transform 0.7s var(--ease); }
  .lb-stage img.on { opacity: 1; transform: none; }
  .lb-p, .lb-n { position: absolute; top: 0; bottom: 0; width: 50%; }
  .lb-p { left: 0; cursor: w-resize; } .lb-n { right: 0; cursor: e-resize; }
  .lb-x { width: 30px; height: 30px; display: grid; place-items: center; }
  .lb-x svg, .lb-arrows svg { width: 18px; height: 18px; }
  .lb-arrows { display: flex; gap: 18px; }
  .lb-arrows button { width: 30px; height: 30px; display: grid; place-items: center; }

  @media (max-width: 860px) {
    :root { --side: 100%; }
    .page { grid-template-columns: minmax(0, 1fr); padding-top: 20px; }
    .side { position: static; grid-template-columns: 150px minmax(0, 1fr); column-gap: 14px; margin-bottom: 18px; }
    .feature { aspect-ratio: auto; height: 100%; }
    .top { padding-bottom: 14px; }
    .menu { gap: 18px; font-size: 14px; overflow-x: auto; }
    .match span { display: none; }
    .harmony .t { grid-row: auto; }
    .harmony .spread { grid-auto-rows: auto; grid-template-rows: auto; }
    .lb-match .lab { display: none; }
    .spread { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; grid-auto-flow: dense; }
    .t { grid-column: auto; grid-row: auto; aspect-ratio: 4 / 5; }
    .t[data-o="L"] { grid-column: 1 / -1; aspect-ratio: 3 / 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .js .t { opacity: 1; transform: none; transition: none; }
    .t img, .feature img { transition: none; }
  }
</style></head>

  }
  feat.addEventListener("click", () => { if (fAt >= 0) open(fAt); });
  feat.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && fAt >= 0) { e.preventDefault(); open(fAt); } });

  /* menu: filters */
  const btns = document.querySelectorAll("#menu button");
  btns.forEach((b) => {
    const c = b.dataset.c; b.querySelector("sup").textContent = c ? ALL.filter((it) => it.c === c).length : ALL.length;
    b.addEventListener("click", () => {
      btns.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      render(c); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });
  });

  $("#match").addEventListener("click", () => {
    harmony = !harmony;
    try { localStorage.setItem("mdg-harmony", harmony ? "1" : "0"); } catch (e) {}
    render(cur); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  });

  /* index */
  const index = $("#index"), burger = $("#burger");
  function buildIndex() {
    const g = $("#indexGrid"); g.innerHTML = "";
    view.forEach((it, i) => { const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Open photograph " + (i + 1)); const im = new Image(); im.src = "img/" + it.f; im.alt = ""; im.loading = "lazy"; b.appendChild(im); b.addEventListener("click", () => open(i)); g.appendChild(b); });
  }
  function toggleIndex(on) { index.classList.toggle("open", on); burger.setAttribute("aria-expanded", String(on)); document.body.style.overflow = on ? "hidden" : ""; }
  burger.addEventListener("click", () => toggleIndex(true));
  $("#indexClose").addEventListener("click", () => toggleIndex(false));

  /* lightbox */
  const lb = $("#lb"), lbImg = $("#lbImg");
  let at = 0;
  function show(i) {
    at = (i + view.length) % view.length; const it = view[at];
    lbImg.classList.remove("on");
    const pre = new Image(); pre.onload = pre.onerror = () => { lbImg.src = pre.src; requestAnimationFrame(() => lbImg.classList.add("on")); }; pre.src = "img/" + it.f;
    $("#lbCat").textContent = CAT[it.c];
    const chips = $("#lbChips"); chips.innerHTML = "";
    it.p.forEach((c) => { const i = document.createElement("i"); i.style.background = c[4]; i.title = c[4].toUpperCase(); chips.appendChild(i); });
    const near = $("#lbNear"); near.innerHTML = "";
    view.map((o, j) => [pd(it.p, o.p), j]).filter(([, j]) => j !== at).sort((a, b) => a[0] - b[0]).slice(0, 8).forEach(([, j]) => {
      const o = view[j], b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Open photograph " + (j + 1));
      const im = new Image(); im.src = "img/" + o.f; im.alt = ""; b.appendChild(im); b.addEventListener("click", () => show(j)); near.appendChild(b);
    });
    $("#lbNum").textContent = String(at + 1).padStart(3, "0") + " / " + String(view.length).padStart(3, "0");
  }
  function open(i) { lb.classList.add("open"); document.body.style.overflow = "hidden"; show(i); }
  function close() { lb.classList.remove("open"); if (!index.classList.contains("open")) document.body.style.overflow = ""; }
  $("#lbX").addEventListener("click", close);
  ["#lbP", "#lbP2"].forEach((s) => $(s).addEventListener("click", () => show(at - 1)));
  ["#lbN", "#lbN2"].forEach((s) => $(s).addEventListener("click", () => show(at + 1)));
  addEventListener("keydown", (e) => {
    if (lb.classList.contains("open")) { if (e.key === "Escape") close(); if (e.key === "ArrowLeft") show(at - 1); if (e.key === "ArrowRight") show(at + 1); }
    else if (index.classList.contains("open") && e.key === "Escape") toggleIndex(false);
  });
  let sx = null;
  lb.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => { if (sx === null) return; const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 40) show(at + (d < 0 ? 1 : -1)); sx = null; });

  /* ---------- the logo film, exactly as the garden plays it, in white over the last photograph ---------- */
  (() => {
    const svg = document.querySelector("#finale svg"); if (!svg) return;
    const ORDER = ["M", "e1", "d", "o", "n", "g", "a", "u", "l", "e2"], DUR = 6.0, CX = 684;
    const cl = (v) => Math.max(0, Math.min(1, v)), oC = (x) => 1 - Math.pow(1 - x, 3), oE = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
    const oB = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const q = (k) => svg.querySelector('[data-k="' + k + '"]');
    const letters = ORDER.map((k) => ({ el: q("L_" + k), cx: +q("L_" + k).getAttribute("data-cx") }));
    const leaves = [{ el: q("F_leaf1"), px: 372, py: 280, start: 1.75, pcx: +q("L_e1").getAttribute("data-cx") }, { el: q("F_leaf2"), px: 809, py: 280, start: 1.95, pcx: +q("L_g").getAttribute("data-cx") }];
    function frame(t) {
      const spread = 0.09 * (1 - oC(cl((t - 0.25) / 2.2)));
      letters.forEach((L, i) => { const lt = cl((t - (0.3 + i * 0.075)) / 1.05); L.el.setAttribute("transform", "translate(" + ((L.cx - CX) * spread).toFixed(2) + " " + (270 * (1 - oE(lt))).toFixed(2) + ")"); });
      leaves.forEach((F) => {
        const lt = cl((t - F.start) / 0.85), s = Math.max(0.0001, oB(lt)); let rot = -48 * (1 - oC(lt)); const after = t - F.start - 0.85;
        if (after > 0) rot += 4 * Math.sin(after * 6.5) * Math.exp(-after * 2.6);
        F.el.setAttribute("transform", "translate(" + ((F.pcx - CX) * spread).toFixed(2) + " 0) translate(" + F.px + " " + F.py + ") rotate(" + rot.toFixed(2) + ") scale(" + s.toFixed(4) + ") translate(" + (-F.px) + " " + (-F.py) + ")");
      });
    }
    let raf = 0, playing = false;
    function play() { if (playing) return; playing = true; const t0 = performance.now(); const step = (now) => { const t = Math.min(DUR, (now - t0) / 1000); frame(t); if (t < DUR) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); }
    function reset() { cancelAnimationFrame(raf); playing = false; frame(0); }
    if (reduce) { frame(DUR); return; }
    frame(0);
    // it plays each time the photograph is mostly in view, and starts again from nothing once it has left
    new IntersectionObserver((es) => es.forEach((e) => { if (e.intersectionRatio >= 0.55) play(); else if (!e.isIntersecting) reset(); }), { threshold: [0, 0.55] }).observe(document.getElementById("finale"));
    window.__finale = { frame };
  })();

  render("");
})();
</script>
</body></html>
